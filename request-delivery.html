<!DOCTYPE html>
<html>
<head>
    <title>Request Delivery - Mayko Delivery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
</head>

<body>

<h1>🚚 Mayko Delivery</h1>

<h2>Request Delivery</h2>

<form onsubmit="requestDelivery(event)">

    <input type="text" id="fullName" placeholder="Full Name"><br><br>

    <input type="tel" id="phone" placeholder="Phone Number"><br><br>

    <input type="text" id="pickup" placeholder="Pickup Address"><br><br>

    <input type="text"  id="delivery" placeholder="Delivery Address"><br><br>
<div id="map"></div>
    <input type="text" id="details" placeholder="Package / Order Details"><br><br>

    <button type="submit">Request Delivery</button>
    <p id="distanceDisplay">Distance: -- miles</p>
    <p id="priceDisplay">Estimated delivery price: --</p>

</form>

<br>

<a href="index.html">Back Home</a>
<script>
 async function geocode(address) { 
  const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
  const data = await response.json();
  if (data.length === 0) return null;  
  return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  }
  function calculateDistance(coord1, coord2) {
    const R = 3958.8;
    const toRad = value => value * Math.PI / 180;
    const lat1 = toRad(coord1[0]);
    const lat2 = toRad(coord2[0]);
    const dLat = lat2 - lat1;
    const dLon = toRad(coord2[1] - coord1[1]);
    const a = Math.sin(dLat / 2) ** 2;
    const b = Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a + b), Math.sqrt(1 - a - b));
    return R * c;
    }
  function calculatePrice(distance) {
    const baseFee = 5.00;
    const pricePerMile = 2.00;
    const totalPrice = baseFee + (distance * pricePerMile);
    return totalPrice.toFixed(2);
    }
    async function requestDelivery(event) {

    event.preventDefault();
    localStorage.setItem("deliveryStatus", "available");
    
    let fullName = document.getElementById("fullName").value;
    let phone = document.getElementById("phone").value;
    let pickup = document.getElementById("pickup").value;
    let delivery = document.getElementById("delivery").value;
    localStorage.setItem("pickupAddress", pickup);
    localStorage.setItem("deliveryAddress", delivery);
    const pickupCoords = await geocodeAddress(pickup);
    const deliveryCoords = await geocodeAddress(delivery);
    pickupMarker.setLatLng(pickupCoords);
    deliveryMarker.setLatLng(deliveryCoords);
    map.fitBounds([pickupCoords, deliveryCoords], { padding: [50, 50] });
    map.invalidateSize();
    const distance = calculateDistance(pickupCoords, deliveryCoords);
    console.log("DISTANCE TEST:", distance);
    const deliveryPrice = calculatePrice(distance);
    localStorage.setItem("deliveryPrice", deliveryPrice);
    localStorage.setItem("deliveryDistance", distance.toFixed(2));
    
    localStorage.setItem("deliveryPickup", pickup);
    localStorage.setItem("deliveryAddress", delivery);
    localStorage.setItem("deliveryPhone", phone);
    localStorage.setItem("deliveryName", fullName);
    localStorage.setItem("deliveryCreatedAt", new Date().toISOString());
    localStorage.setItem("deliveryId", "MD-" + Date.now());
    localStorage.setItem("maykoCurrentOrder", JSON.stringify({
    orderId: localStorage.getItem("deliveryId"),
    distance: distance.toFixed(2),
    totalPrice: deliveryPrice,
    driverPay: localStorage.getItem("driverPay"),
    pickup: pickup,
    delivery: delivery
}));
    let details = document.getElementById("details").value;
    localStorage.setItem("deliveryDetails", fullName + " | " + phone + " | " + pickup + " → " + delivery + " | " + details);
   localStorage.setItem("deliveryStatus","available");
    alert("Delivery request sent!");
    }
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script>

    const map = L.map('map').setView([32.7948,-116.9625],13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        function(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            map.setView([latitude, longitude], 15);

            L.marker([latitude, longitude])
                .addTo(map)
                .bindPopup("You are here")
                .openPopup();
        },
        function(error) {
            console.log("GPS error:", error);
        }
    );
} else {
    console.log("Geolocation is not supported by this browser.");
}
async function geocodeAddress(address) {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(address);
    const response = await fetch(url);
    const data = await response.json();

    if (data.length === 0) {
        throw new Error("Address not found: " + address);
    }

    return L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
}
const pickupMarker = L.marker([32.7948, -116.9625])
    .addTo(map)
    .bindPopup("Pickup Location");
const deliveryMarker = L.marker([32.8050, -116.9500])
    .addTo(map)
    .bindPopup("Delivery Location");
    const routeLine = L.polyline([
    pickupMarker.getLatLng(),
    deliveryMarker.getLatLng()
]).addTo(map);
const pickup = pickupMarker.getLatLng();
const delivery = deliveryMarker.getLatLng();
map.removeLayer(routeLine);

const routingControl = L.Routing.control({
    waypoints: [pickup, delivery],
    addWaypoints: false,
    draggableWaypoints: false,
    routeWhileDragging: false,
    show: false,
    createMarker: function () {
        return null;
    }
}).addTo(map); 
 routingControl.on('routesfound', function(e) {
    const distanceMiles = e.routes[0].summary.totalDistance / 1609.344;
    const deliveryPrice = 3.00 + (distanceMiles * 1.50);
    const driverPay = deliveryPrice * 0.80;
    localStorage.setItem("driverPay", driverPay.toFixed(2));
    localStorage.setItem("deliveryPrice", deliveryPrice.toFixed(2));
    document.getElementById("priceDisplay").textContent = "Estimated delivery price: $" + deliveryPrice.toFixed(2);
    console.log("Distance:", distanceMiles.toFixed(2), "miles");
   localStorage.setItem("deliveryDistance", distanceMiles.toFixed(2));
    document.getElementById("distanceDisplay").textContent = "Distance: " + distanceMiles.toFixed(2) + " miles";
});
 </script>

</body>
</html>
