<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Mayko Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚚 Mayko Delivery</h1>

<h2>Admin Dashboard</h2>

<p>Welcome Admin</p>


<h3>Users</h3>
<p>Customers: <span id="customerCount">0</span></p>
<p>Drivers: <span id="driverCount">0</span></p>
<p>Merchants: <span id="merchantCount">0</span></p>

<h3>Deliveries</h3>

<p>Active Deliveries: <span id="activeDeliveries">0</span></p>

<h3>Revenue</h3>

<p id="adminRevenue">$0.00</p>

<a href="index.html">Back Home</a>
<script>
const currentOrder = JSON.parse(localStorage.getItem("maykoCurrentOrder"));
const adminRevenue = Number(localStorage.getItem("adminRevenue")) || 0;
document.getElementById("adminRevenue").innerText = "$" + adminRevenue.toFixed(2);
const deliveryStatus = localStorage.getItem("deliveryStatus");
const activeDeliveries = currentOrder && deliveryStatus !== "completed" ? 1 : 0;
document.getElementById("activeDeliveries").innerText = activeDeliveries;
const customerCount = Number(localStorage.getItem("customerCount") || 0);
document.getElementById("customerCount").innerText = customerCount;
const driverCount = Number(localStorage.getItem("driverCount") || 0);
document.getElementById("driverCount").innerText = driverCount;
const merchantCount = Number(localStorage.getItem("merchantCount") || 0);
document.getElementById("merchantCount").innerText = merchantCount;
</script>
</body>
</html>
