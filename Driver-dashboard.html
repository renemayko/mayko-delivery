<!DOCTYPE html>
<html>
<head>
    <title>Driver Dashboard - Mayko Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚚 Mayko Delivery</h1>

<h2>Driver Dashboard</h2>

<p>Welcome Driver</p>
  <p id="driverStatusText">⚫ You are Offline</p>

<button id="onlineButton" onclick="toggleOnline()">Go Online</button>

<h3>Available Deliveries</h3>

<p id="deliveryStatus">No delivery available yet.</p>
  <div id="deliveryDetails"></div>
  <button id="acceptDeliveryButton" onclick="acceptDelivery()">Accept Delivery</button>

<h3>Earnings</h3>

<p id="earnings">$0.00</p>
<div id="orderDetails">
  <p>Order ID: <span id="orderId"></span></p>
  <p>Distance: <span id="distance"></span></p>
  <p>Price: <span id="price"></span></p>
  <p>Driver Pay: <span id="driverPay"></span></p>
  <p>Pickup: <span id="pickup"></span></p>
  <p>Dropoff: <span id="dropoff"></span></p>
  <p>Delivery Type: <span id="orderDeliveryType"></span></p>
  <p>Status: <span id="orderStatus"></span></p>
  <p>Package: <span id="packageType"></span></p>
  <p>Notes: <span id="orderNotes"></span></p>

</div>

<a href="index.html">Back Home</a>
<script>
  const order = JSON.parse(localStorage.getItem("maykoCurrentOrder"));
  if (order) {
    document.getElementById("orderId").innerText = localStorage.getItem("deliveryId");
    document.getElementById("distance").innerText = localStorage.getItem("deliveryDistance");
    document.getElementById("price").innerText = localStorage.getItem("deliveryPrice");
    document.getElementById("driverPay").innerText = order.driverPay;
    document.getElementById("pickup").innerText = order.pickup;
    document.getElementById("dropoff").innerText = order.delivery;
    }
    if (order) {
      console.log("Current order loaded:", order);
      }
      if (!order) {
        console.log("No current order found");
        }
function toggleOnline() {
    let button = document.getElementById("onlineButton");

    if (button.innerText === "Go Online") {
   document.getElementById("driverStatusText").innerText = "🟢 You are Online";  
      button.innerText = "Go Offline";
        localStorage.setItem("driverStatus", "online");
    } else {
        button.innerText = "Go Online";
      document.getElementById("driverStatusText").innerText = "⚫ You are Offline";
        localStorage.setItem("driverStatus", "offline");
    }
}
let driverStatus = localStorage.getItem("driverStatus");
if (driverStatus === "online") {
document.getElementById("driverStatusText").innerText = "🟢 You are Online";
document.getElementById("onlineButton").innerText = "Go Offline";
document.getElementById("onlineButton").style.backgroundColor = "green";
}
  let deliveryStatus = localStorage.getItem("deliveryStatus");
  console.log("Delivery status:", deliveryStatus);
let pickupAddress = localStorage.getItem("deliveryPickup");
  let savedEarnings = Number(localStorage.getItem("driverEarning")) || 0;
  let deliveryAddress = localStorage.getItem("deliveryAddress");
  let deliveryDistance = localStorage.getItem("deliveryDistance");
  let deliveryPrice = localStorage.getItem("deliveryPrice");
  let driverPay = localStorage.getItem("driverPay");
  let companyShare = localStorage.getItem("companyShare");
  let customerPrice = localStorage.getItem("deliveryPrice");
  let pickupToShow = pickupAddress || "Not available";
  let deliveryToShow = deliveryAddress || "Not available";
  let distanceToShow = deliveryDistance || "Not available";
  let priceToShow = customerPrice || "Not available";
  let driverPayToShow = driverPay || "Not available";
  let companyShareToShow = companyShare || "Not available";
  document.getElementById("pickup").innerText = pickupToShow;
  document.getElementById("dropoff").innerText = deliveryToShow;
  document.getElementById("orderStatus").innerText = "Waiting for driver"
  document.getElementById("distance").innerText = distanceToShow;
  document.getElementById("price").innerText = "$" + priceToShow;
  document.getElementById("driverPay").innerText = "$" + driverPayToShow;
  //document.getElementById("companyShare").innerText = "$" + companyShareToShow;
  //document.getElementById("status").innerText = "Available";
  document.getElementById("orderStatus").innerText = "Waiting for driver";
  document.getElementById("orderDeliveryType").innerText = "Standard Delivery";
  document.getElementById("paymentStatus").innerText = "Pending";

  document.getElementById("paymentMethod").innerText = "Card";
  document.getElementById("orderId").innerText = "MD-1001";

  document.getElementById("earnings").innerText = "$" + savedEarnings.toFixed(2);
if (driverStatus === "online") {
  
document.getElementById("driverStatusText").innerText = "🟢 You are Online";
    document.getElementById("onlineButton").innerText = "Go Offline";
}
  


document.getElementById("acceptDeliveryButton").style.display = "none";
if (deliveryStatus === "available" && savedStatus === "online") {
  
  document.getElementById("deliveryStatus").innerText = "📦 New Delivery Available";
  document.getElementById("deliveryDetails").innerText = "pickup: Store - Delivery: Customer";
  document.getElementById("acceptDeliveryButton").style.display = "inline-block";
}
  else if (deliveryStatus === "completed") {
    document.getElementById("deliveryStatus").innerText = "No delivery available yet.";
    document.getElementById("acceptDeliveryButton").style.display = "none";
    }
function acceptDelivery() {
  if (localStorage.getItem("driverStatus") !== "online") {
    alert("You must be online to accept a delivery.");
    return;
}
  
  
  alert("Delivery accepted!");
  localStorage.setItem("deliveryStatus", "accepted");
  document.getElementById("deliveryStatus").innerText = "🚚 Delivery Accepted - In Progress";
  document.getElementById("acceptDeliveryButton").innerText = "Complete Delivery";
  document.getElementById("acceptDeliveryButton").onclick = completeDelivery;
}
  

function completeDelivery() {
alert("Delivery completed!");
  localStorage.setItem("deliveryStatus", "completed");
  localStorage.setItem("deliveryCompletedAt", new Date().toISOString());
  localStorage.setItem("completedDeliveryId", localStorage.getItem("deliveryId") || "");
  let earnings = Number(localStorage.getItem("earnings")) || 0;
  earnings = earnings + Number(driverPay || 0);
  localStorage.setItem("earnings", earnings);
  document.getElementById("earnings").innerText = "$" + earnings.toFixed(2);
  document.getElementById("deliveryStatus").innerText = "✅ Delivery Completed";
  document.getElementById("acceptDeliveryButton").style.display = "none";
  document.getElementById("deliveryDetails").innerText = ""; localStorage.removeItem("deliveryDetails");
  }
</script>
</body>
</html>
